{{ define "main" }}

<div class="article-wrap">
  <a href="{{ .Parent.RelPermalink }}" class="back-link">← Back</a>
  <header class="article-header">
    <h1>{{ .Title }}</h1>
    <div class="article-meta">{{ .Date.Format "January 2, 2006" }}</div>
  </header>
  <div class="article-body">
    {{ .Content }}
  </div>
</div>

{{ end }}
